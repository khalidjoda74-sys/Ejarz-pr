workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: darvoo_appstore

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - forsa_pro_appstore_profile_v3
        certificates:
          - ejarz_pro_distribution
      vars:
        BUNDLE_ID: com.forsapro.app

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter project
        script: flutter analyze

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          IOS_BUILD_NAME=${PUBSPEC_VERSION%%+*}
          IOS_BUILD_NUMBER=${PUBSPEC_VERSION##*+}
          if [ "$IOS_BUILD_NUMBER" = "$PUBSPEC_VERSION" ] || ! [[ "$IOS_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            IOS_BUILD_NUMBER=11
          fi
          if [ "$IOS_BUILD_NUMBER" -lt 11 ]; then
            IOS_BUILD_NUMBER=11
          fi
          echo "Building iOS $IOS_BUILD_NAME ($IOS_BUILD_NUMBER)"
          flutter build ipa --release --build-name=$IOS_BUILD_NAME --build-number=$IOS_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
