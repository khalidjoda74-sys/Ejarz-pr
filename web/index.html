<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08795D">
  <meta name="color-scheme" content="light">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق عقدك لإدارة وتجهيز ومتابعة عقود الإيجار العقارية.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="عقدك">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>عقدك</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff; }
    #app-loading { position: fixed; inset: 0; z-index: 10000; display: grid;
      place-items: center; padding: 24px; box-sizing: border-box; background: #fff;
      font-family: Tahoma, Arial, sans-serif; color: #24282b; text-align: center; }
    #app-loading section { max-width: 440px; width: 100%; }
    #app-loading img { width: 180px; height: 190px; object-fit: contain; }
    #app-loading p { font-size: 14px; line-height: 1.9; color: #626b70; }
    .loading-line { height: 4px; border-radius: 8px; background: #e7f5f0; overflow: hidden; margin: 24px auto; max-width: 240px; }
    .loading-line::after { content: ''; display: block; background: #08795d; width: 45%; height: 100%; animation: loading 1.4s ease-in-out infinite alternate; }
    @keyframes loading { to { transform: translateX(-125%); } }
    @media(prefers-reduced-motion: reduce) { .loading-line::after { animation: none; width: 100%; } }
    #loading-retry { border: 0; border-radius: 12px; background: #08795d; color: white; padding: 13px 28px; font: inherit; cursor: pointer; }
    #loading-retry:focus-visible { outline: 3px solid #d4a53b; outline-offset: 4px; }
    #app-loading[hidden], #loading-retry[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <section>
      <img src="brand/aqdak-splash.png" alt="عقدك" width="180" height="190">
      <p id="loading-message">جاري تجهيز مساحة إدارة عقودك وعقاراتك…</p>
      <div class="loading-line" aria-hidden="true"></div>
      <button id="loading-retry" hidden type="button">إعادة المحاولة</button>
      <noscript><p>يرجى تفعيل JavaScript في المتصفح لتشغيل عقدك.</p></noscript>
    </section>
  </div>
  <script src="app_loader.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
